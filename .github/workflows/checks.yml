name: Checks

# The tax engine is the one part of this repository where a wrong number is
# invisible: a chart still draws. The self-test runs on every push that touches
# it, so a bad edit fails here rather than on the page.

on:
  push:
    paths:
      - 'js/**'
      - 'data/**'
      - 'scripts/check.mjs'
      - '.github/workflows/checks.yml'
  pull_request:
  workflow_dispatch: {}

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tax engine self-test
        run: node scripts/check.mjs
